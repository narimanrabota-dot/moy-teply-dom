<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Три раздела видео — ещё 20</title>
<style>
:root{--bg:#F7F4EF;--ink:#22304C;--dim:#616D85;--line:#E6E0D6;--br:#C24A28;--card:#fff;--sh:0 1px 2px rgba(34,48,76,.06),0 4px 12px rgba(34,48,76,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:32px 16px 96px}
h1{font-size:29px;margin:0 0 8px;font-weight:600}
.lead{color:var(--dim);margin:0 0 32px;max-width:75ch}
.v{background:#fff;border-radius:20px;padding:24px;margin-bottom:32px;box-shadow:var(--sh)}
.v__h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.v__n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--br);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.v__t{font-size:20px;font-weight:600}
.v__hgt{margin-left:auto;font-size:14px;color:var(--dim);white-space:nowrap}
.v__d{color:var(--dim);font-size:14px;margin:0 0 16px 44px}
.stage{background:var(--bg);border-radius:12px;padding:24px;overflow:hidden}
.ctx{height:40px;border-radius:12px;background:#fff;border:1px dashed var(--line);color:#A39B8F;font-size:12px;display:flex;align-items:center;padding:0 16px;text-transform:uppercase;letter-spacing:.06em}
.ctx+.box,.box+.ctx{margin-top:32px}
/* общие детали */
.h2{font-size:24px;font-weight:600;margin:0}
.sub{font-size:14px;color:var(--dim);margin:4px 0 0}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pc{flex:none;background:#fff;border-radius:12px;padding:6px;box-shadow:var(--sh);cursor:pointer}
.pc .t{position:relative;display:block;border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:#ddd}
.t img{width:100%;height:100%;object-fit:cover;display:block}
.t .pl{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:rgba(255,255,255,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.6)}
.t .pl:after{content:"";position:absolute;left:14px;top:11px;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.t .du{position:absolute;left:6px;bottom:6px;font-size:12px;color:#fff;background:rgba(20,20,20,.45);backdrop-filter:blur(6px);padding:2px 8px;border-radius:20px}
.tag{position:absolute;right:6px;top:6px;font-size:12px;color:#fff;background:rgba(34,48,76,.75);padding:2px 8px;border-radius:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;font:inherit;font-size:14px;cursor:pointer;background:transparent;color:var(--dim);padding:8px 16px;border-radius:20px;transition:.2s}
.tab b{font-weight:500;color:inherit;opacity:.7;margin-left:4px}
.seg{display:inline-flex;background:#EDE7DD;border-radius:20px;padding:4px}
.seg .tab.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.chips .tab{background:#fff;border:1px solid var(--line)}
.chips .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ul .tab{border-radius:0;padding:8px 0;margin-right:16px;border-bottom:2px solid transparent}
.ul .tab.on{color:var(--ink);border-color:var(--br)}
.arr{display:flex;gap:8px;margin-left:auto}
.arr i{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-style:normal;color:var(--ink)}
.hd{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.cnt{font-size:14px;color:var(--dim)}
.stp.on,.txt .tab.on{color:var(--ink);background:#fff;box-shadow:var(--sh)}.big.on{border-color:var(--ink)!important;box-shadow:inset 0 0 0 1px var(--ink)}.dark .tab{color:rgba(255,255,255,.7)}.dark .tab.on{background:#fff;color:var(--ink)}.thumb .tab.on{border-color:var(--ink)!important;color:var(--ink)}
.lnk{color:var(--br);font-size:14px;text-decoration:none;font-weight:500}
@media(max-width:640px){.stage{padding:16px}.v{padding:16px}.v__d{margin-left:0}}
</style></head><body><main>
<h1>Три раздела видео — ещё 20 вариантов (21–40)</h1>
<p class="lead">Продолжение <a href="video-3-razdela-20.html" style="color:var(--br)">первых 20</a>. Здесь варианты продуманы под продажу: подсказка, зачем смотреть, отзывы на виду, путь дома от каркаса до отзыва. Обложки настоящие, вкладки нажимаются, справа — высота блока.</p>
<div id="out"></div>
</main>
<script>
const V=[
 {n:2,d:'1:36',s:'o'},{n:3,d:'2:49',s:'o'},{n:4,d:'1:22',s:'o'},{n:6,d:'3:53',s:'o'},
 {n:7,d:'0:52',s:'s'},{n:8,d:'0:27',s:'s'},{n:9,d:'1:26',s:'s'},{n:10,d:'3:48',s:'s'},
 {n:1,d:'0:55',s:'r'},{n:5,d:'0:38',s:'r'}];
const S={o:{t:'Видеообзоры',f:'Видеообзоры домов серии «Стамбул»',w:'готовые дома'},s:{t:'Процесс строительства',f:'Процесс строительства домов серии «Стамбул»',w:'со стройки'},r:{t:'Видеоотзывы',f:'Видеоотзывы о домах серии «Стамбул»',w:'от владельцев'}};
const K=['o','s','r'];
const img=n=>`../img/zvid-snt-metro-${n}.webp`;
const by=k=>V.filter(v=>v.s===k);
const pl=(n)=>n%10==1&&n%100!=11?'ролик':(n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'ролика':'роликов');
const card=(v,w=132,tag)=>`<div class="pc" style="width:${w}px"><span class="t"><img src="${img(v.n)}" alt="" loading="lazy"><span class="pl"></span><span class="du">${v.d}</span>${tag?`<span class="tag">${S[v.s].t.replace('Процесс строительства','Стройка').replace('Видео','').replace(/^о/,'О')}</span>`:''}</span></div>`;
const row=(list,w,tag)=>`<div class="row">${list.map(v=>card(v,w,tag)).join('')}</div>`;
const tabs=(cls,id,all)=>`<div class="tabs ${cls}" data-tabs="${id}">${all?`<button class="tab on" data-k="all">Все<b>${V.length}</b></button>`:''}${K.map((k,i)=>`<button class="tab ${!all&&i==0?'on':''}" data-k="${k}">${S[k].t}<b>${by(k).length}</b></button>`).join('')}</div>`;
const arr='<span class="arr"><i>‹</i><i>›</i></span>';
const short=k=>({o:'Обзоры',s:'Стройка',r:'Отзывы'})[k];
const why={o:'Готовые дома снаружи и внутри',s:'Как собираем каркас и утепляем',r:'Что говорят владельцы'};
const ico={o:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',s:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M6 20V9h12v11"/><path d="M9 20V9M15 20V9M6 13h12"/></svg>',r:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>'};
const T=(id,k0,lab,cls,extra)=>`<div class="tabs ${cls||'ul'}" data-tabs="${id}">${K.map(k=>`<button class="tab ${k==k0?'on':''}" data-k="${k}">${lab(k)}</button>`).join('')}</div>`;
const F=(id,k0,w,extra)=>`<div data-feed="${id}">${row(by(k0),w||132)}</div>`;
const circ=(list,s=40,m=12)=>`<span style="display:flex">${list.slice(0,3).map((v,i)=>`<img src="${img(v.n)}" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:${i?-m:0}px">`).join('')}</span>`;
const variants=[
['Вкладки с пояснением','Под каждой вкладкой — строка, зачем её смотреть. Человек сразу понимает, что внутри.',id=>`
<h2 class="h2" style="margin-bottom:16px">Видео домов серии «Стамбул»</h2>
<div class="tabs" data-tabs="${id}" style="gap:0;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto">${K.map((k,i)=>`<button class="tab ${i?'':'on'}" data-k="${k}" style="border-radius:0;padding:8px 24px 12px 0;text-align:left;border-bottom:2px solid ${i?'transparent':'var(--br)'};margin-bottom:-1px"><span style="display:block;font-size:17px;font-weight:600;color:var(--ink)">${S[k].t} <b>${by(k).length}</b></span><span style="font-size:12px">${why[k]}</span></button>`).join('')}</div>
${F(id,'o')}`],
['Шаги стройки как вкладки','Вкладки — путь дома: 1 Стройка → 2 Готовый дом → 3 Отзыв. Рассказывает историю, а не просто делит ролики.',id=>`
<div class="hd" style="align-items:center"><h2 class="h2">От каркаса до отзыва</h2>${arr}</div>
<div class="tabs" data-tabs="${id}" style="margin-bottom:16px;gap:4px;align-items:center">${['s','o','r'].map((k,i)=>`${i?'<span style="color:var(--line)">→</span>':''}<button class="tab ${i?'':'on'} stp" data-k="${k}"><span class="v__n" style="display:inline-grid;width:20px;height:20px;font-size:12px;margin-right:6px;vertical-align:-3px">${i+1}</span>${S[k].t.replace('Процесс строительства','Стройка')}</button>`).join('')}</div>
${F(id,'s')}`],
['Цифры-вкладки','Три крупные цифры как вкладки: «4 обзора · 4 со стройки · 2 отзыва». Цифра продаёт лучше слов.',id=>`
<h2 class="h2" style="margin-bottom:16px">Посмотрите дома «Стамбул» на видео</h2>
<div class="tabs" data-tabs="${id}" style="gap:8px;margin-bottom:16px;flex-wrap:nowrap">${K.map((k,i)=>`<button class="tab ${i?'':'on'} big" data-k="${k}" style="border-radius:12px;padding:8px 16px;text-align:left;border:1px solid var(--line);background:#fff"><span style="display:block;font-size:29px;font-weight:600;line-height:1.1;color:var(--ink)">${by(k).length}</span><span style="font-size:12px">${({o:'обзора',s:'со стройки',r:'отзыва'})[k]}</span></button>`).join('')}</div>
${F(id,'o',120)}`],
['Вкладки с иконками','Кирпичная иконка у каждого раздела, как у значков в верху карточки. Узнаётся без чтения.',id=>`
<div class="hd" style="align-items:center"><h2 class="h2">Видео</h2>${T(id,'o',k=>`<span style="display:inline-flex;gap:6px;align-items:center"><span style="color:var(--br);display:flex">${ico[k]}</span>${S[k].t}</span>`,'chips')}${arr}</div>
${F(id,'o')}`],
['Одна карточка с «Живыми фото»','«Живые фото» и видео — одна белая карточка: сверху полоса фото, ниже вкладки и лента. Всё «живое» в одном месте.',id=>`
<div class="pc" style="padding:16px 16px 20px;cursor:default">
<div style="display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px">${circ(by('o'),44,14)}<div><div style="font-weight:600">Живые фото построенного дома</div><div class="cnt">7 снимков с объекта</div></div><span style="margin-left:auto;color:var(--br)">→</span></div>
<div class="hd" style="align-items:center;margin-bottom:12px"><b style="font-weight:600">Видео</b>${T(id,'o',k=>S[k].t,'ul')}</div>${F(id,'o',112)}</div>`],
['Плейлист','Слева крупный ролик 9 : 16, справа список всех 10 по разделам — как плейлист на YouTube.',id=>`
<h2 class="h2" style="margin-bottom:16px">Видео домов серии «Стамбул»</h2>
<div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px">${card(V[3],200)}<div style="max-height:290px;overflow:auto">${K.map(k=>`<div style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--br);font-weight:600;margin:4px 0">${S[k].t}</div>${by(k).map((v,i)=>`<div style="display:flex;gap:12px;align-items:center;padding:4px 8px;border-radius:8px;${v.n==6?'background:var(--bg)':''}"><img src="${img(v.n)}" style="width:36px;height:48px;border-radius:6px;object-fit:cover"><span style="font-size:14px">${k=='r'?'Отзыв владельца':k=='s'?'Стройка, часть '+(i+1):'Обзор дома'}</span><span class="cnt" style="margin-left:auto;font-size:12px">${v.d}</span></div>`).join('')}`).join('')}</div></div>`],
['Карточка-обложка раздела в ленте','Одна лента: перед роликами каждого раздела — цветная карточка с его названием и числом. Листаешь — и сразу видно, где что.',id=>{
 const col={o:'#22304C',s:'#C24A28',r:'#3E6B4E'};
 return `<div class="hd"><h2 class="h2">Видео домов серии «Стамбул»</h2>${arr}</div><div class="row">${K.map(k=>`<div class="pc" style="width:132px;background:${col[k]};color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px"><span style="display:flex;opacity:.85">${ico[k]}</span><b style="font-weight:600;font-size:14px;margin-top:8px;line-height:1.25;hyphens:auto" lang="ru">${S[k].t.replace('Процесс строительства','Процесс стройки')}</b><span style="font-size:12px;opacity:.8">${by(k).length} ${pl(by(k).length)}</span></div>${by(k).map(v=>card(v)).join('')}`).join('')}</div>`}],
['Тёмный кинозал','Видео на тёмном фоне (цвет шапки таблицы цен), вкладки светлые. Блок выделяется как «смотреть».',id=>`
<div style="background:#22304C;border-radius:20px;padding:24px;color:#fff">
<div class="hd" style="align-items:center;margin-bottom:16px"><h2 class="h2" style="color:#fff">Видео</h2><div class="tabs dark" data-tabs="${id}">${K.map((k,i)=>`<button class="tab ${i?'':'on'}" data-k="${k}">${S[k].t} <b>${by(k).length}</b></button>`).join('')}</div>${arr.replace(/<i>/g,'<i style="background:transparent;border-color:rgba(255,255,255,.3);color:#fff">')}</div>
${F(id,'o',124)}</div>`],
['Отзывы первыми','Открыто сразу «Видеоотзывы»: слова владельцев убеждают сильнее всего. Обзоры и стройка — соседние вкладки.',id=>`
<div class="hd" style="align-items:center"><h2 class="h2">Что говорят владельцы «Стамбулов»</h2></div>
<div style="margin-bottom:16px"><span class="seg">${T(id,'r',k=>`${S[k].t} <b>${by(k).length}</b>`,'sg').replace('class="tabs sg"','class="tabs sg" style="display:contents"')}</span></div>
${F(id,'r',150)}`],
['Тексты-ссылки без заголовка','Нет большого заголовка: строка «Видео: Обзоры 4 · Стройка 4 · Отзывы 2» и лента. Самое скромное по месту.',id=>`
<div class="tabs txt" data-tabs="${id}" style="margin-bottom:12px;align-items:baseline;gap:4px"><b style="font-weight:600;font-size:20px;margin-right:8px">Видео:</b>${K.map((k,i)=>`${i?'<span style="color:var(--line)">·</span>':''}<button class="tab ${i?'':'on'}" data-k="${k}" style="padding:4px 8px">${short(k)} <b>${by(k).length}</b></button>`).join('')}</div>
${F(id,'o',116)}`],
['Три колоды','Три стопки карточек, слегка веером; подпись под стопкой. Нажатие — окно с роликами раздела. ~200 px.',id=>`
<h2 class="h2" style="margin-bottom:24px">Видео домов серии «Стамбул»</h2>
<div style="display:flex;gap:48px;flex-wrap:wrap">${K.map(k=>`<div style="text-align:center"><div style="position:relative;width:150px;height:150px">${by(k).slice(0,3).reverse().map((v,i,a)=>`<img src="${img(v.n)}" style="position:absolute;left:${30+(i-(a.length-1))*-10}px;top:${(a.length-1-i)*4}px;width:96px;height:128px;object-fit:cover;border-radius:10px;border:4px solid #fff;box-shadow:var(--sh);transform:rotate(${(i-(a.length-1)/2)*-6}deg)">`).join('')}</div><div style="font-weight:600;margin-top:8px">${S[k].t}</div><div class="cnt">${by(k).length} ${pl(by(k).length)}</div></div>`).join('')}</div>`],
['Вкладки-миниатюры','Каждая вкладка — маленькая обложка + название + число. Вкладка сама показывает, что в ней.',id=>`
<div class="hd" style="align-items:center;margin-bottom:16px"><h2 class="h2">Видео</h2>${arr}</div>
<div class="tabs thumb" data-tabs="${id}" style="margin-bottom:16px">${K.map((k,i)=>`<button class="tab ${i?'':'on'}" data-k="${k}" style="display:flex;align-items:center;gap:8px;padding:4px 16px 4px 4px;background:#fff;border:1px solid var(--line)"><img src="${img(by(k)[k=='o'?3:0].n)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover">${S[k].t} <b>${by(k).length}</b></button>`).join('')}</div>
${F(id,'o')}`],
['Аккордеон','Три строки, открыта одна. Закрытые — одной строкой с кружками. Высота как у одной ленты + 2 строки.',id=>`
<h2 class="h2" style="margin-bottom:16px">Видео домов серии «Стамбул»</h2>
<div class="acc" data-acc>${K.map((k,i)=>`<div class="acc__i ${i?'':'on'}" style="background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:var(--sh)"><button class="acc__b" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px">${circ(by(k),32,10)}<b style="font-weight:600">${S[k].t}</b><span class="cnt">${by(k).length} ${pl(by(k).length)}</span><span style="margin-left:auto;color:var(--br)">${i?'+':'−'}</span></button><div class="acc__c" style="padding:0 16px 16px;${i?'display:none':''}">${row(by(k),112)}</div></div>`).join('')}</div>`],
['Одна большая + вкладки','Сверху вкладки, под ними — один крупный ролик слева и 3 маленьких справа. Главное видно сразу.',id=>`
<div class="hd" style="align-items:center;margin-bottom:16px"><h2 class="h2">Видео</h2>${T(id,'o',k=>`${S[k].t} <b>${by(k).length}</b>`,'chips')}</div>
<div data-feed="${id}" data-hero>${hero(by('o'))}</div>`],
['Полоса как «Живые фото», с вкладками внутри','Принятая белая полоса «Живые фото», только справа вместо стрелки — три кнопки разделов. Нажатие — окно на весь экран.',id=>`
<div class="pc" style="display:flex;align-items:center;gap:16px;padding:16px;flex-wrap:wrap;cursor:default">${circ(V.filter(v=>[6,7,1].includes(v.n)),48,14)}<div><div style="font-weight:600;font-size:17px">Видео домов серии «Стамбул»</div><div class="cnt">10 роликов с объектов</div></div><div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">${K.map(k=>`<span style="font-size:14px;padding:8px 16px;border-radius:20px;background:var(--bg);white-space:nowrap">${short(k)} <b style="font-weight:500;color:var(--dim)">${by(k).length}</b></span>`).join('')}</div></div>`],
['Видео-стена','Все 10 мелких обложек разом, раздел — цветной точкой. На компьютере один ряд, на телефоне 2–3 ряда.',id=>{
 const col={o:'#22304C',s:'#C24A28',r:'#3E6B4E'};
 return `<div class="hd" style="align-items:center;margin-bottom:12px"><h2 class="h2">Видео</h2><span style="display:flex;gap:16px;font-size:14px;color:var(--dim)">${K.map(k=>`<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col[k]};margin-right:6px"></i>${S[k].t}</span>`).join('')}</span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px">${V.map(v=>`<div style="position:relative">${card(v,0).replace('width:0px','width:auto')}<i style="position:absolute;right:10px;top:10px;width:10px;height:10px;border-radius:50%;background:${col[v.s]};border:2px solid #fff"></i></div>`).join('')}</div>`}],

function hero(list){return `<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;max-width:620px">${card(list[list.length>3?3:0],0).replace('width:0px','width:auto')}<div style="display:grid;grid-template-columns:repeat(${Math.min(3,Math.max(1,list.length-1))},1fr);gap:12px;align-content:start">${list.filter((_,i)=>i!=(list.length>3?3:0)).slice(0,3).map(v=>card(v,0).replace('width:0px','width:auto')).join('')}</div></div>`}
const out=document.getElementById('out');
variants.forEach(([t,d,f],i)=>{
 const id='v'+(i+1);
 out.insertAdjacentHTML('beforeend',`<section class="v"><div class="v__h"><span class="v__n">${i+21}</span><span class="v__t">${t}</span><span class="v__hgt" id="${id}h"></span></div><p class="v__d">${d}</p><div class="stage"><div class="ctx">Живые фото построенного дома</div><div class="box" id="${id}b">${f(id)}</div><div class="ctx">Планировка</div></div></section>`);
});
document.addEventListener('click',e=>{
 const ab=e.target.closest('.acc__b');if(ab){const it=ab.parentElement;it.parentElement.querySelectorAll('.acc__i').forEach(x=>{const o=x===it;x.querySelector('.acc__c').style.display=o?'':'none';x.querySelector('.acc__b span:last-child').textContent=o?'−':'+'});measure();return}
 const b=e.target.closest('[data-tabs] .tab');if(!b)return;
 const wrap=b.closest('[data-tabs]'),id=wrap.dataset.tabs;
 wrap.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
 wrap.querySelectorAll('.tab').forEach(x=>{if(x.style.borderBottom)x.style.borderBottomColor=x===b?'var(--br)':'transparent'});
 const feed=document.querySelector(`[data-feed="${id}"]`),k=b.dataset.k,list=k=='all'?V:by(k);
 const tag=feed.hasAttribute('data-tag');
 if(feed.hasAttribute('data-hero')){feed.innerHTML=hero(list);measure();return}
 if(feed.hasAttribute('data-grid'))feed.firstElementChild.innerHTML=list.map(v=>card(v,0,tag).replace('width:0px','width:auto')).join('');
 else{const w=parseInt(feed.querySelector('.pc')?.style.width)||132;feed.innerHTML=row(list,w,tag)}
 measure();
});
function measure(){variants.forEach((_,i)=>{const b=document.getElementById('v'+(i+1)+'b');document.getElementById('v'+(i+1)+'h').textContent='≈ '+Math.round(b.offsetHeight)+' px по высоте'})}
window.addEventListener('load',measure);window.addEventListener('resize',measure);
</script>
