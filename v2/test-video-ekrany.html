<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточка на разных экранах</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--ink:#22304C;--mut:#6b625b;--bg:#EFEBE6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
.wrap{padding:24px 16px 64px;max-width:1800px;margin:0 auto}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 24px}
.row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.dev{flex:none}.dev b{display:block;font-size:17px}.dev small{display:block;color:var(--mut);margin-bottom:8px}
.scr{overflow:hidden;border-radius:20px;background:#fff;box-shadow:0 0 0 8px #1f1a16,0 12px 32px rgba(0,0,0,.25)}
.scr iframe{border:0;transform-origin:0 0;display:block}
</style></head><body><div class="wrap">
<h1>Стамбул 12,1 × 8,1 — как выглядит на разных экранах</h1>
<p class="sub">Живая карточка в размерах настоящих устройств, уменьшено для обзора. Внутри каждого экрана можно листать.</p>
<div class="row" id="row"></div>
</div>
<script>
var URL_ = 'proekt-stambul-121x81.html';
var D = [
  ['iPhone SE', 375, 667, .6], ['iPhone 15', 393, 852, .6], ['Android (Samsung, Xiaomi)', 412, 915, .6],
  ['iPad mini, вертикально', 768, 1024, .45], ['iPad Air, вертикально', 820, 1180, .42],
  ['iPad, горизонтально', 1180, 820, .42], ['Ноутбук', 1280, 800, .42], ['Большой монитор', 1920, 1080, .3]
];
var row = document.getElementById('row');
D.forEach(function (d) {
  var box = document.createElement('div'); box.className = 'dev';
  box.innerHTML = '<b>' + d[0] + '</b><small>' + d[1] + ' × ' + d[2] + '</small>';
  var s = document.createElement('div'); s.className = 'scr';
  s.style.width = Math.round(d[1] * d[3]) + 'px'; s.style.height = Math.round(d[2] * d[3]) + 'px';
  var f = document.createElement('iframe');
  f.src = URL_; f.width = d[1]; f.height = d[2]; f.loading = 'lazy';
  f.style.transform = 'scale(' + d[3] + ')';
  s.appendChild(f); box.appendChild(s); row.appendChild(box);
});
</script></body></html>
