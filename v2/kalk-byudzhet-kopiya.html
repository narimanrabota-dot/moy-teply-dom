<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Копия бюджетного калькулятора</title>

  <style>
    :root {
      --ink: #263140;
      --ink-soft: #7b8794;
      --green: #2f5044;
      --green-dark: #223c33;
      --line: #e3e7e3;
      --field: #f6f7f5;
      --bg1: #2f5044;
      --bg2: #6d9c86;
      --bg3: #cfe0d4;
      --warn-bg: #fbeeec;
      --warn-ink: #8c3b2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      background-color: var(--bg3);
      background-image: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      background-attachment: fixed;
      color: var(--ink);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .shell {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 18px;
      padding: 24px 22px;
      box-shadow: 0 30px 64px rgba(18, 42, 32, .40), 0 4px 10px rgba(18, 42, 32, .20);
    }

    [hidden] { display: none !important; }

    h1 { font-size: 22px; line-height: 1.25; letter-spacing: -.2px; }
    .subtitle { font-size: 14px; color: var(--ink-soft); margin-top: 3px; }

    .field { margin-bottom: 14px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }

    input[type="text"], input[type="number"], select {
      width: 100%; height: 46px; padding: 0 12px;
      font-size: 16px; font-family: inherit; color: inherit;
      background: var(--field); border: 1px solid var(--line);
      border-radius: 10px; outline: none; appearance: none;
      transition: border-color .15s, background .15s;
    }

    input:focus, select:focus {
      border-color: var(--green); background: #fff;
      box-shadow: 0 0 0 3px rgba(47, 80, 68, .10);
    }

    select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%237b8794' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat; background-position: right 14px center; padding-right: 34px;
    }

    button.primary {
      width: 100%; height: 48px;
      font-size: 16px; font-weight: 600; font-family: inherit;
      color: #fff; background: var(--green);
      border: none; border-radius: 10px; cursor: pointer;
      transition: background .15s, transform .05s;
    }
    button.primary:hover { background: var(--green-dark); }
    button.primary:active { transform: translateY(1px); }
    button.primary:disabled { opacity: .55; cursor: default; }

    /* ---------- шапка ---------- */

    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
    }
    .linkbtn {
      border: none; background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline;
      padding: 0;
    }
    .linkbtn:hover { color: var(--green); }

    /* ---------- калькулятор ---------- */

    .dims { display: flex; align-items: center; gap: 8px; }
    .dims input { text-align: center; }
    .dims .mul { color: var(--ink-soft); font-size: 16px; flex: 0 0 auto; }

    .hint { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }

    .area-summary {
      display: flex; justify-content: space-between; align-items: baseline;
      background: var(--field); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 14px;
      font-size: 13px; color: var(--ink-soft);
    }
    .area-summary b { color: var(--green); font-size: 15px; }

    .toggle-line {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 10px; font-size: 14px; font-weight: 500;
    }

    .options { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 6px; }
    .options-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
      color: var(--ink-soft); margin: 10px 0 2px;
    }

    .acc-group { position: relative; padding-left: 13px; border-bottom: 1px solid var(--line); }
    .acc-group:last-of-type { border-bottom: none; }
    .acc-group::before {
      content: ""; position: absolute; left: 0; top: 9px; bottom: 9px;
      width: 4px; border-radius: 3px; background: var(--gc);
    }

    .ah {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 0; cursor: pointer; user-select: none; font-size: 14px;
    }
    .ah .cnt {
      flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
      background: var(--green); color: #fff;
    }
    .ah .cnt.off { background: var(--field); color: #b9c1c6; }
    .ah .name { font-weight: 600; white-space: nowrap; }
    .ah .ell {
      flex: 1 1 auto; min-width: 0; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; color: var(--ink-soft);
    }
    .ah .sum { font-weight: 600; color: var(--green); font-size: 13px; white-space: nowrap; }
    .ah .sum.off { color: #c3cbcf; font-weight: 500; }
    .ah .arrow { color: var(--ink-soft); flex: 0 0 auto; }

    .acc-body { padding-bottom: 8px; }
    .acc-group.open .acc-body {
      margin-left: 10px; padding-left: 15px; border-left: 2px solid var(--gc);
    }
    .acc-group.open .ah .name { color: var(--gc); }

    .sub { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; font-weight: 500; }

    .opt-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .opt-row:last-child { border-bottom: none; }
    .price { color: var(--ink-soft); font-size: 12px; margin-left: 5px; }

    /* количество опор: формула и результат крупно, рядом кнопка правки */
    .found-val { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
    .found-num {
      font-weight: 700; color: var(--green); font-size: 15px;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .found-val .num { width: 80px; }
    .found-val .addbtn { height: 28px; font-size: 11px; padding: 0 10px; }

    .stepper { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
    .stepper button {
      width: 30px; height: 30px; border: 1px solid var(--line); background: var(--field);
      border-radius: 8px; color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer;
    }
    .stepper button:hover { background: var(--green); color: #fff; border-color: var(--green); }
    .stepper .val { min-width: 30px; text-align: center; font-weight: 600; font-size: 14px; }
    .stepper .val.zero { color: #b9c1c6; }

    .pills {
      display: inline-flex; flex-wrap: wrap; background: var(--field);
      border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px;
    }
    .pills button {
      border: none; background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 13px; font-weight: 500;
      padding: 6px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap;
    }
    .pills button.on { background: var(--green); color: #fff; }

    .switch { position: relative; flex: 0 0 auto; width: 46px; height: 27px; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
    .switch .track { position: absolute; inset: 0; background: #d6dbd6; border-radius: 99px; transition: background .18s; }
    .switch .track::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 21px; height: 21px; background: #fff; border-radius: 50%;
      box-shadow: 0 1px 3px rgba(38, 49, 64, .25); transition: transform .18s;
    }
    .switch input:checked + .track { background: var(--green); }
    .switch input:checked + .track::after { transform: translateX(19px); }

    input.num {
      width: 92px; height: 32px; padding: 0 10px; font-size: 13px; text-align: right;
      font-family: inherit; color: inherit; background: var(--field);
      border: 1px solid var(--line); border-radius: 8px; outline: none;
    }
    select.mini {
      width: auto; max-width: 62%; height: 32px; padding: 0 26px 0 9px;
      font-size: 13px; background-position: right 9px center; border-radius: 8px;
    }

    .opt-warn {
      font-size: 12px; color: var(--warn-ink); background: var(--warn-bg);
      border-radius: 8px; padding: 7px 10px; margin-top: 6px;
    }

    .opt-sum {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
      font-size: 13px; color: var(--ink-soft);
    }
    .opt-sum b { color: var(--green); font-size: 16px; }

    .result {
      margin-top: 18px; padding: 18px; background: var(--field);
      border-left: 3px solid var(--green); border-radius: 12px;
    }
    .result.error { background: var(--warn-bg); border-left-color: var(--warn-ink); color: var(--warn-ink); }
    .result-total { font-size: 28px; font-weight: 700; color: var(--green); margin-bottom: 10px; }
    .result.error .result-total { color: inherit; }
    .result-row {
      display: flex; justify-content: space-between; gap: 12px;
      font-size: 14px; padding: 5px 0; border-bottom: 1px solid var(--line);
    }
    .result-row:last-of-type { border-bottom: none; }
    .result-row span:first-child { color: var(--ink-soft); }
    .result-row span:last-child { font-weight: 600; white-space: nowrap; }
    .result-line { font-size: 13px; color: var(--ink-soft); margin-top: 10px; }

    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink); color: #fff;
      font-size: 13.5px; padding: 11px 18px; border-radius: 10px;
      box-shadow: 0 10px 30px rgba(18, 42, 32, .35);
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 100; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .addbtn {
      border: 1px solid var(--line); background: #fff; color: var(--green);
      font: inherit; font-size: 11.5px; font-weight: 600;
      text-transform: none; letter-spacing: 0;
      padding: 4px 11px; border-radius: 8px; cursor: pointer;
      transition: border-color .16s ease, background .16s ease;
    }
    .addbtn:hover { border-color: #c6d2c9; background: #fafbfa; }

    .resetbtn {
      display: block; margin: 12px auto 0;
      font-size: 12.5px; color: var(--ink-soft);
      background: none; border: 0; cursor: pointer;
      padding: 4px 8px; border-radius: 8px;
      transition: color .16s ease, background .16s ease;
    }
    .resetbtn:hover { color: var(--ink); background: var(--field); }

    /* ---------- на телефоне мелкий текст не прочитать ---------- */
    @media (max-width: 620px) {
      body { font-size: 16px; }
      .hint,
      .sub,
      .price,
      .result-line,
      .opt-row > span:first-child,
      .ah .ell { font-size: 14.5px; }
      .result-row { font-size: 15.5px; padding: 7px 0; }
      .ah .name { font-size: 16px; }
      .ah .sum { font-size: 14.5px; }
      .opt-sum { font-size: 15px; }
      .opt-sum b { font-size: 18px; }
      .result-total { font-size: 32px; }
      label { font-size: 15px; }
      .area-summary { font-size: 14.5px; }
      .area-summary b { font-size: 17px; }
      .stepper .val { font-size: 15px; }
      select.mini, input.num { font-size: 15px; height: 36px; }
      /* длинная формула опор не выталкивает строку за край экрана */
      .found-val { flex: 0 1 auto; min-width: 0; flex-wrap: wrap; justify-content: flex-end; }
      .found-num { white-space: normal; text-align: right; }
      .linkbtn { font-size: 14.5px; }
      .resetbtn { font-size: 14px; }
    }
  </style>
</head>

          <span class="mul">×</span>
          <input type="number" id="liveB" min="0" step="0.1" placeholder="9">

      </div>

      <div class="toggle-line">
        <span>Терраса</span>

        Отделка снаружи и внутри — ниже, в «Дополнительно».</p>

      <div class="field">
        <label for="distance">Дистанция доставки, км</label>
        <input type="number" id="distance" min="0" step="1" value="50">

      <div class="options" id="options"></div>

      <button class="primary" id="calcBtn" style="margin-top:16px">Рассчитать</button>
      <button class="linkbtn resetbtn" id="resetBtn">сбросить к базовой комплектации</button>

      <div id="resultBox"></div>

  const UNITS_TABLE = {

    '40x100': [[18, 1], [24, 2], [30, 3], [36, 3], [42, 4], [48, 5], [54, 5], [60, 6]],
    '40x150': [[18, 2], [24, 3], [30, 4], [36, 5], [42, 5], [48, 6], [54, 7], [60, 8]]

  function getUnits(area, frame) {
    const pts = UNITS_TABLE[frame], first = pts[0], last = pts[pts.length - 1];
    let raw;
    if (area <= first[0]) raw = area / (first[0] / first[1]);
    else if (area >= last[0]) raw = area / (last[0] / last[1]);
    else {
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        if (area >= a[0] && area <= b[0]) {
          raw = a[1] + (b[1] - a[1]) * (area - a[0]) / (b[0] - a[0]);
          break;
        }
      }
    }
    return Math.max(1, Math.ceil(raw - 0.0001));
  }

      '<label class="switch"><input type="checkbox" id="portage"><span class="track"></span></label></div>' +
      '<div class="opt-row" id="portageRow" hidden><span>Дистанция проноса, м</span>' +
      '<input type="number" class="num" id="portageM" min="0" step="1" value="0"></div>' +
      '<div class="opt-row"><span>Вентзазор снаружи стен <span class="price" id="ventWallsHint"></span></span>' +
      '<label class="switch"><input type="checkbox" id="ventWalls"><span class="track"></span></label></div>' +
      '<div class="opt-row"><span>Вентзазор снаружи по крыше <span class="price" id="ventRoofHint"></span></span>' +
      '<label class="switch"><input type="checkbox" id="ventRoof"><span class="track"></span></label></div>');

    h += '<div class="opt-sum"><span>Доп-опции</span><b id="optSum">0 ₽</b></div>';
    $('options').innerHTML = h;
    applyDefaults();

    $('deliveryHint').textContent =
      'До ' + P.delivery_free_km + ' км — доставка ' + money(P.delivery_base) +
      '. Свыше — плюс ' + money(P.delivery_per_km) + ' за каждый км сверх порога. Максимум ' + MAX_KM + ' км.';
  }

  // ============================================================
  //  ЗАПОМИНАНИЕ РАСЧЁТА (переживает перезагрузку страницы)
  // ============================================================

  const FORM_KEY = 'mtd_kbk_form_v1';

  const pillVal = g => {
    const b = $('options').querySelector('[data-pills="' + g + '"] button.on');
    return b ? b.dataset.val : null;
  };

  function setPill(g, val) {
    if (!val) return;
    const wrap = $('options').querySelector('[data-pills="' + g + '"]');
    if (!wrap) return;
    const btn = wrap.querySelector('[data-val="' + val + '"]');
    if (!btn) return;
    wrap.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  }

  // состояние формы одним объектом
  function formState() {
    const opts = $('options');
    const counts = {};
    opts.querySelectorAll('[data-id]').forEach(r => {
      const n = parseInt(r.querySelector('.val').textContent, 10) || 0;
      if (n) counts[r.dataset.id] = n;
    });
    const partRow = opts.querySelector('[data-kind="part"]');

    return {
        liveA: $('liveA').value, liveB: $('liveB').value,
        terrace: $('hasTerrace').checked,
        terrA: $('terrA').value, terrB: $('terrB').value,
        frame: $('frame').value,
        finish: $('finish') ? $('finish').value : null,
        distance: $('distance').value,
        counts: counts,
        partMat: $('partMat') ? $('partMat').value : null,
        partLen: partRow ? parseInt(partRow.querySelector('.val').textContent, 10) || 0 : 0,
        wallType: pillVal('wall'),
        ridgeType: pillVal('ridge'),
        ceilType: pillVal('ceil'),
        foundType: pillVal('found'),
        pileSize: $('pileSize') ? $('pileSize').value : null,
        foundManual: foundManual,
        foundEditing: foundEditing,
        floorLive: $('floorLive') ? $('floorLive').value : null,
        floorTerr: $('floorTerr') ? $('floorTerr').value : null,
        floorMesh: $('floorMesh') ? $('floorMesh').checked : false,
        floorAnti: $('floorAnti') ? $('floorAnti').checked : false,
        outFinish: $('outFinish') ? $('outFinish').value : null,
        roofMat: $('roofMat') ? $('roofMat').value : null,
        roofType: pillVal('roof'),
        steps: $('steps').checked,
        portage: $('portage').checked,
        portageM: $('portageM').value,
        ventWalls: $('ventWalls') ? $('ventWalls').checked : false,
        ventRoof: $('ventRoof') ? $('ventRoof').checked : false
    };
  }

  function saveForm() {
    try { localStorage.setItem(FORM_KEY, JSON.stringify(formState())); }
    catch (e) { /* нет места в хранилище — не критично */ }
  }

  function savedForm() {
    try { return JSON.parse(localStorage.getItem(FORM_KEY)); } catch (e) { return null; }
  }

  function restoreForm() {
    applyForm(savedForm());
  }

  function applyForm(s) {
    if (!s) return;

    const set = (id, v) => { if (v !== undefined && v !== null && $(id)) $(id).value = v; };
    set('liveA', s.liveA); set('liveB', s.liveB);
    set('terrA', s.terrA); set('terrB', s.terrB);
    set('frame', s.frame); set('finish', s.finish);
    set('distance', s.distance);
    $('hasTerrace').checked = !!s.terrace;

    const opts = $('options');
    // сохранённый расчёт главнее умолчаний: обнуляем всё, потом ставим сохранённое.
    // иначе убранная дверь из базовой комплектации вернётся сама
    opts.querySelectorAll('[data-id] .val').forEach(v => { v.textContent = '0'; });
    Object.keys(s.counts || {}).forEach(id => {
      const row = opts.querySelector('[data-id="' + id + '"]');
      if (row) row.querySelector('.val').textContent = s.counts[id];
    });

    if (s.partMat && $('partMat')) $('partMat').value = s.partMat;
    const partRow = opts.querySelector('[data-kind="part"]');
    if (partRow && s.partLen) partRow.querySelector('.val').textContent = s.partLen;

    setPill('wall', s.wallType);
    setPill('ridge', s.ridgeType);
    setPill('ceil', s.ceilType);
    setPill('found', s.foundType);
    if (s.pileSize && $('pileSize')) $('pileSize').value = s.pileSize;
    foundManual = (s.foundManual === undefined) ? null : s.foundManual;
    foundEditing = !!s.foundEditing;

    if (s.floorLive && $('floorLive')) $('floorLive').value = s.floorLive;
    if (s.floorTerr && $('floorTerr')) $('floorTerr').value = s.floorTerr;
    if ($('floorMesh')) $('floorMesh').checked = !!s.floorMesh;
    if ($('floorAnti')) $('floorAnti').checked = !!s.floorAnti;
    if (s.outFinish && $('outFinish')) $('outFinish').value = s.outFinish;
    if (s.roofMat && $('roofMat')) $('roofMat').value = s.roofMat;
    setPill('roof', s.roofType);

    $('steps').checked = !!s.steps;
    $('portage').checked = !!s.portage;
    set('portageM', s.portageM);
    if ($('ventWalls')) $('ventWalls').checked = !!s.ventWalls;
    if ($('ventRoof')) $('ventRoof').checked = !!s.ventRoof;
  }

  // ============================================================
  //  РАСЧЁТ
  // ============================================================

  function readDims() {
    const num = id => parseFloat($(id).value) || 0;
    const hasTerrace = $('hasTerrace').checked;
    const liveA = num('liveA'), liveB = num('liveB');
    const terrA = hasTerrace ? num('terrA') : 0;
    const terrB = hasTerrace ? num('terrB') : 0;
    const liveArea = liveA * liveB, terrArea = terrA * terrB;
    return { hasTerrace, liveA, liveB, terrA, terrB, liveArea, terrArea, totalArea: liveArea + terrArea };
  }

  // null — количество опор считается автоматически, число — задано вручную
  let foundManual = null;
  let foundEditing = false;

  function readOptions(dims, area, km, frame) {
    const el = $('options');
    const pick = s => el.querySelector(s);
    const cnt = row => parseInt(row.querySelector('.val').textContent, 10) || 0;

    // winItems / doorItems — построчно для сметы: что именно и по сколько
    let winCount = 0, winSum = 0; const winParts = [], winItems = [];
    WINDOWS.forEach(w => {
      const n = cnt(el.querySelector('[data-kind="win"][data-id="' + w.id + '"]'));
      if (!n) return;
      winCount += n; winSum += n * P[w.id]; winParts.push(w.short + ' ×' + n);
      winItems.push({ label: w.label, n: n, price: P[w.id], sum: n * P[w.id] });
    });

    let doorCount = 0, doorSum = 0; const doorParts = [], doorItems = [];
    DOORS.forEach(d => {
      const n = cnt(el.querySelector('[data-kind="door"][data-id="' + d.id + '"]'));
      if (!n) return;
      doorCount += n; doorSum += n * P[d.id]; doorParts.push(d.short + ' ×' + n);
      doorItems.push({ label: d.label, n: n, price: P[d.id], sum: n * P[d.id] });
    });

    // параметры дома: высота стен и конька — доплата за м² общей площади
    const wallKey = pick('[data-pills="wall"] button.on').dataset.val;
    const ridgeKey = pick('[data-pills="ridge"] button.on').dataset.val;
    const ceilKey = pick('[data-pills="ceil"] button.on').dataset.val;

    const wallSum = wallKey === '25' ? P.wall_25 * (area || 0) : 0;
    const ridgeSum = ridgeKey === '120' ? P.ridge_120 * (area || 0) : 0;
    const paramSum = wallSum + ridgeSum;

    const paramParts = [];
    paramParts.push(wallKey === '25' ? 'стены 2,5 м' : 'стены 2,2 м');
    paramParts.push(ridgeKey === '120' ? 'конёк 120 см' : 'конёк 80 см');
    paramParts.push(ceilKey === 'flat' ? 'потолок ровный' : 'потолок под конёк');

    // пол: жилая часть считается по жилой площади, терраса — по своей
    const floorLiveKey = pick('#floorLive') ? pick('#floorLive').value : null;
    const floorTerrKey = pick('#floorTerr') ? pick('#floorTerr').value : null;
    const floorLiveSum = floorLiveKey ? (P[floorLiveKey] || 0) * dims.liveArea : 0;
    const floorTerrSum = (floorTerrKey && dims.terrArea) ? (P[floorTerrKey] || 0) * dims.terrArea : 0;
    const mesh = pick('#floorMesh') ? pick('#floorMesh').checked : false;
    const meshSum = mesh ? (P.floor_mesh || 0) * dims.liveArea : 0;
    // антисептик — по всему полу, жилая часть вместе с террасой
    const anti = pick('#floorAnti') ? pick('#floorAnti').checked : false;
    const antiSum = anti ? (P.floor_antiseptic || 0) * (area || 0) : 0;

    const floorSum = floorLiveSum + floorTerrSum + meshSum + antiSum;

    const floorParts = [];
    // при заказе одной террасы позиции жилой части не показываем: их там нет
    if (floorLiveKey && dims.liveArea) floorParts.push(labelOf(floorLiveKey));
    if (floorTerrKey && dims.terrArea) floorParts.push('терраса: ' + labelOf(floorTerrKey));
    if (mesh && dims.liveArea) floorParts.push('сетка от грызунов');
    if (anti) floorParts.push('антисептик');

    const finishSel = pick('#finish') ? pick('#finish').value : null;
    const inExtraKey = finishSel ? FINISH_EXTRA[finishSel] : null;
    const inExtraSum = inExtraKey ? (P[inExtraKey] || 0) * dims.liveArea : 0;

    // наружная отделка стен — по жилой площади, без террасы
    const outKey = pick('#outFinish') ? pick('#outFinish').value : null;
    const outSum = outKey ? (P[outKey] || 0) * dims.liveArea : 0;

    const partKey = pick('#partMat') ? pick('#partMat').value : Object.keys(PARTITIONS)[0];
    const partLen = cnt(pick('[data-kind="part"]'));
    const partSum = partLen * P[partKey];

    const steps = pick('#steps').checked;
    const stepsSum = steps ? P.steps : 0;
    const portage = pick('#portage').checked;
    const portageM = parseFloat(pick('#portageM').value) || 0;
    const portageSum = portage ? P.portage_base + portageM * P.portage_per_m : 0;
    const ventWalls = pick('#ventWalls') ? pick('#ventWalls').checked : false;
    const ventRoof  = pick('#ventRoof')  ? pick('#ventRoof').checked  : false;
    const ventWallsSum = ventWalls ? (P.vent_walls || 0) * dims.liveArea : 0;
    const ventRoofSum  = ventRoof  ? (P.vent_roof  || 0) * (area || 0) : 0;

    const miscParts = [];
    if (steps) miscParts.push('ступеньки');
    if (portage) miscParts.push('пронос ' + portageM + ' м');
    if (ventWalls) miscParts.push('вентзазор стен');
    if (ventRoof) miscParts.push('вентзазор крыши');

    const foundKey = pick('[data-pills="found"] button.on').dataset.val;
    const isPiles = foundKey === 'piles';
    const pileSize = pick('#pileSize').value;

    const liveOporA = oporPerSide(dims.liveA), liveOporB = oporPerSide(dims.liveB);
    const terrOporA = oporPerSide(dims.terrA), terrOporB = oporPerSide(dims.terrB);
    const liveOpor = liveOporA * liveOporB, terrOpor = terrOporA * terrOporB;
    // считается от сторон дома, но количество можно вписать своё
    const autoCount = liveOpor + terrOpor;
    const foundCount = foundManual !== null ? foundManual : autoCount;
    const foundUnitPrice = isPiles ? P[pileSize] : P.found_block;
    const foundBase = foundCount * foundUnitPrice;
    const pileKmSum = isPiles && foundCount ? (km || 0) * P.pile_per_km : 0;
    const foundSum = foundBase + pileKmSum;
    const foundText = foundCount
      ? (isPiles ? 'сваи ' + PILE_SIZES[pileSize] : 'бетонные блоки') + ' ×' + foundCount
      : 'нужны размеры домика';

    const roofKey = pick('[data-pills="roof"] button.on').dataset.val;
    const roofMat = pick('#roofMat').value;
    const roofMatSum = P[roofMat] * (area || 0);
    const roof2Sum = roofKey === '2' ? roof2Price(area, frame) : 0;
    const roofSum = roofMatSum + roof2Sum;

    const groups = {
      // счётчик показывает, сколько позиций выбрано, а не сколько они стоят
      floor: { sum: floorSum, count: ((floorLiveKey && dims.liveArea) ? 1 : 0) +
                      ((floorTerrKey && dims.terrArea) ? 1 : 0) + ((mesh && dims.liveArea) ? 1 : 0) + (anti ? 1 : 0),
               text: floorParts.join(', ') },
      finish:{ sum: outSum + inExtraSum,
               count: dims.liveArea ? ((outKey ? 1 : 0) + (finishSel ? 1 : 0)) : 0,
               text: !dims.liveArea ? '' :
                     (outKey ? 'снаружи ' + labelOf(outKey) : '') +
                     (finishSel ? ', внутри ' + FINISH_NAMES[finishSel].toLowerCase() : '') },
      param: { sum: paramSum, count: (wallKey ? 1 : 0) + (ridgeKey ? 1 : 0) + (ceilKey ? 1 : 0),
               text: paramParts.join(', ') },
      win:   { sum: winSum, count: winCount, text: winParts.join(', ') },
      door:  { sum: doorSum, count: doorCount, text: doorParts.join(', ') },
      part:  { sum: partSum, count: partLen, text: partLen ? PARTITIONS[partKey] + ' ' + partLen + ' м' : '' },
      found: { sum: foundSum, count: foundCount, text: foundText },
      roof:  { sum: roofSum, count: (roofMat ? 1 : 0) + (roofKey ? 1 : 0),
               text: ROOF_MATERIALS[roofMat].short + ', ' + roofKey + ' ската' },
      misc:  { sum: stepsSum + portageSum + ventWallsSum + ventRoofSum, count: miscParts.length, text: miscParts.join(', ') }
    };

    return {
      wallKey, ridgeKey, ceilKey, wallSum, ridgeSum, paramSum,
      floorLiveKey, floorTerrKey, floorLiveSum, floorTerrSum, mesh, meshSum, anti, antiSum, floorSum,
      outKey, outSum, finishSel, inExtraKey, inExtraSum,
      winCount, winSum, winItems, doorCount, doorSum, doorItems, partKey, partLen, partSum,
      steps, stepsSum, portage, portageM, portageSum,
      ventWalls, ventWallsSum, ventRoof, ventRoofSum,
      foundKey, isPiles, pileSize, liveOporA, liveOporB, terrOporA, terrOporB, terrOpor,
      autoCount, foundCount, foundUnitPrice, foundBase, pileKmSum, foundSum,
      roofKey, roofMat, roofMatSum, roof2Sum, roofSum, groups,
      total: paramSum + floorSum + outSum + inExtraSum + winSum + doorSum + partSum + stepsSum + portageSum + ventWallsSum + ventRoofSum + foundSum + roofSum
    };
  }

  let lastQuote = null;

  function refreshAll() {
    const dims = readDims();
    const km = parseFloat($('distance').value) || 0;
    const frame = $('frame').value;
    const o = readOptions(dims, dims.totalArea, km, frame);

    const s = $('areaSummary');
    if (!dims.totalArea) s.innerHTML = '<span>Укажите размеры</span><b>—</b>';
    else if (dims.terrArea) s.innerHTML = '<span>Жилая ' + dims.liveArea.toFixed(1) +
      ' м² + терраса ' + dims.terrArea.toFixed(1) + ' м²</span><b>' + dims.totalArea.toFixed(1) + ' м²</b>';
    else s.innerHTML = '<span>Жилая площадь</span><b>' + dims.liveArea.toFixed(1) + ' м²</b>';

    $('terraceField').hidden = !dims.hasTerrace;

    $('options').querySelectorAll('.acc-group').forEach(g => {
      const d = o.groups[g.dataset.group];
      const c = g.querySelector('.cnt'), sum = g.querySelector('.sum');
      c.textContent = d.count; c.classList.toggle('off', !d.count);
      g.querySelector('.ell').textContent = d.text || 'не выбрано';
      sum.textContent = money(d.sum); sum.classList.toggle('off', !d.sum);
    });

    $('optSum').textContent = money(o.total);
    $('options').querySelectorAll('.stepper .val').forEach(v =>
      v.classList.toggle('zero', v.textContent.trim() === '0'));

    $('partPrice').textContent = money(P[o.partKey]) + '/м';

    const hasTerr = readDims().terrArea > 0;
    $('floorTerrRow').hidden = !hasTerr;
    $('floorTerrHintRow').hidden = !hasTerr;
    $('floorNoTerr').hidden = hasTerr;

    $('floorLiveHint').textContent = P[o.floorLiveKey]
      ? money(P[o.floorLiveKey]) + ' за м² жилой площади' + (o.floorLiveSum ? ' = ' + money(o.floorLiveSum) : '')
      : 'цена не задана';
    $('floorTerrHint').textContent = (o.floorTerrKey && P[o.floorTerrKey])
      ? money(P[o.floorTerrKey]) + ' за м² террасы' + (o.floorTerrSum ? ' = ' + money(o.floorTerrSum) : '')
      : 'цена не задана';
    $('meshHint').textContent = P.floor_mesh
      ? money(P.floor_mesh) + '/м²' + (o.meshSum ? ' = ' + money(o.meshSum) : '')
      : 'цена не задана';
    if ($('antiHint')) $('antiHint').textContent = P.floor_antiseptic
      ? money(P.floor_antiseptic) + '/м² по всему полу' + (o.antiSum ? ' = ' + money(o.antiSum) : '')
      : '';

    $('ventWallsHint').textContent = P.vent_walls
      ? money(P.vent_walls) + '/м²' + (o.ventWallsSum ? ' = ' + money(o.ventWallsSum) : '')
      : 'цена не задана';
    $('ventRoofHint').textContent = P.vent_roof
      ? money(P.vent_roof) + '/м²' + (o.ventRoofSum ? ' = ' + money(o.ventRoofSum) : '')
      : 'цена не задана';

    const inKey = 'm2_' + $('frame').value + '_' + baseFinish(o.finishSel);
    if ($('inHint')) $('inHint').textContent = P[inKey]
      ? money(P[inKey]) + ' за м² жилой площади — уже в стоимости домика'
      : 'входит в стоимость домика';

    $('outHint').textContent = P[o.outKey]
      ? money(P[o.outKey]) + ' за м² жилой площади' + (o.outSum ? ' = ' + money(o.outSum) : '')
      : 'входит в базовую цену';

    $('wallHint').textContent = '2,2 м в базе · 2,5 м — ' + money(P.wall_25) +
      ' за м² общей площади' + (o.wallSum ? ' = ' + money(o.wallSum) : '');
    $('ridgeHint').textContent = '80 см в базе · 120 см — ' + money(P.ridge_120) +
      ' за м² общей площади' + (o.ridgeSum ? ' = ' + money(o.ridgeSum) : '');
    $('portageRow').hidden = !o.portage;
    $('pileSizeRow').hidden = !o.isPiles;
    $('roof2Rate').textContent = '2 ската — ' + money(P['roof2_' + frame]) +
      '/м², минимум ' + money(P.roof2_min);

    $('foundLabel').innerHTML = 'Количество ' + (o.isPiles ? 'свай' : 'блоков') +
      ' <span class="price">' + money(o.foundUnitPrice) + ' / шт</span>';

    const fw = $('foundWarn');
    fw.hidden = o.foundCount > 0;
    if (!o.foundCount) fw.textContent = 'Укажите размеры домика в самом верху — количество опор считается от сторон';

    // формула и результат: «4 × 5 = 20 свай», с террасой «4×5 + 3×2 = 26 свай»
    const word = o.isPiles
      ? plural(o.foundCount, 'свая', 'сваи', 'свай')
      : plural(o.foundCount, 'блок', 'блока', 'блоков');

    const formula = o.terrOpor
      ? o.liveOporA + ' × ' + o.liveOporB + ' + ' + o.terrOporA + ' × ' + o.terrOporB
      : o.liveOporA + ' × ' + o.liveOporB;

    const ff = $('foundField');
    const fc = $('foundCount');
    const fe = $('foundEdit');

    if (foundEditing) {
      ff.hidden = true;
      fc.hidden = false;
      if (document.activeElement !== fc) fc.value = o.foundCount || '';
      fe.textContent = 'вернуть расчёт';
    } else {
      ff.hidden = false;
      fc.hidden = true;
      fe.textContent = 'изменить';
      ff.textContent = o.autoCount
        ? formula + ' = ' + o.autoCount + ' ' + word
        : '—';
    }

    saveForm();
    calculate(true);   // смета всегда на экране, пока хватает данных
  }

  // собирает смету из того, что сейчас стоит в форме. Ничего не рисует.
  // возвращает либо { error }, либо { lines, total, note, input }
  function buildQuote() {
    const dims = readDims();
    const frame = $('frame').value, finish = $('finish').value;
    const km = parseFloat($('distance').value);

    const err = t => ({ error: t });

    // жилая часть не обязательна: можно продать одну террасу или хозблок
    if (!dims.liveArea && !dims.terrArea) return err('Укажите размеры жилой части или террасы');
    if (dims.hasTerrace && !dims.terrArea) return err('Укажите обе стороны террасы');
    if (isNaN(km) || km < 0) return err('Укажите дистанцию доставки в км');
    if (km > MAX_KM) return err('Дальше ' + MAX_KM + ' км не возим — уточните дистанцию');

    const livePrice = P['m2_' + frame + '_' + baseFinish(finish)];
    const liveSum = dims.liveArea * livePrice;
    const terrPrice = P['m2_' + frame + '_hozblok'];
    const terrSum = dims.terrArea * terrPrice;

    const units = getUnits(dims.totalArea, frame);
    const onePer = deliveryPrice(km), oneAsm = assemblyPrice(km);
    const deliveryTotal = units * onePer, assemblyTotal = units * oneAsm;

    const o = readOptions(dims, dims.totalArea, km, frame);
    const total = liveSum + terrSum + deliveryTotal + assemblyTotal + o.total;

    const lines = [];
    // t — название, q — количество, p — цена за единицу, v — сумма, g — раздел
    const add = (t, q, pr, v, g) => lines.push({ t: t, q: q, p: pr, v: v, g: g });
    const m2 = a => a.toFixed(1) + ' м²';
    const sht = n => n + ' шт';

    if (liveSum) add('Жилая часть, каркас ' + FRAME_NAMES[frame] + ', отделка ' + FINISH_NAMES[finish],
      m2(dims.liveArea), money(livePrice), liveSum, 'Дом и отделка');
    if (terrSum) add('Терраса', m2(dims.terrArea), money(terrPrice), terrSum, 'Дом и отделка');
    if (o.floorLiveSum) add('Пол ' + labelOf(o.floorLiveKey) + ' в жилой части',
      m2(dims.liveArea), money(P[o.floorLiveKey]), o.floorLiveSum, 'Дом и отделка');
    if (o.floorTerrSum) add('Пол террасы ' + labelOf(o.floorTerrKey),
      m2(dims.terrArea), money(P[o.floorTerrKey]), o.floorTerrSum, 'Дом и отделка');
    if (o.meshSum) add('Сетка от грызунов', m2(dims.liveArea), money(P.floor_mesh), o.meshSum, 'Дом и отделка');
    if (o.antiSum) add('Обработка антисептиком', m2(dims.totalArea), money(P.floor_antiseptic), o.antiSum, 'Дом и отделка');
    if (o.outSum) add('Наружная отделка ' + labelOf(o.outKey),
      m2(dims.liveArea), money(P[o.outKey]), o.outSum, 'Дом и отделка');
    if (o.inExtraSum) add('Внутренняя отделка ' + labelOf(o.inExtraKey),
      m2(dims.liveArea), money(P[o.inExtraKey]), o.inExtraSum, 'Дом и отделка');
    if (o.wallSum) add('Стены 2,5 м', m2(dims.totalArea), money(P.wall_25), o.wallSum, 'Дом и отделка');
    if (o.ridgeSum) add('Конёк 120 см', m2(dims.totalArea), money(P.ridge_120), o.ridgeSum, 'Дом и отделка');

    o.winItems.forEach(w => add('Окно ' + w.label, sht(w.n), money(w.price), w.sum, 'Окна, двери, перегородки'));
    o.doorItems.forEach(d => add(d.label, sht(d.n), money(d.price), d.sum, 'Окна, двери, перегородки'));
    if (o.partLen) add('Перегородки ' + PARTITIONS[o.partKey],
      o.partLen + ' м', money(P[o.partKey]), o.partSum, 'Окна, двери, перегородки');

    if (o.foundBase) add(o.isPiles ? 'Свая винтовая ' + PILE_SIZES[o.pileSize] : 'Бетонные блоки',
      sht(o.foundCount), money(o.foundUnitPrice), o.foundBase, 'Фундамент и кровля');
    if (o.pileKmSum) add('Доставка свай', km + ' км', money(P.pile_per_km), o.pileKmSum, 'Фундамент и кровля');
    if (o.roofMatSum) add('Кровля ' + ROOF_MATERIALS[o.roofMat].label,
      m2(dims.totalArea), money(P[o.roofMat]), o.roofMatSum, 'Фундамент и кровля');
    if (o.roof2Sum) add('Двускатная крыша', m2(dims.totalArea), money(P['roof2_' + frame]),
      o.roof2Sum, 'Фундамент и кровля');

    add('Доставка, дистанция ' + km + ' км', units + ' ' + plural(units, 'рейс', 'рейса', 'рейсов'),
      money(onePer), deliveryTotal, 'Доставка и сборка');
    add('Сборка бригадой', units + ' ' + plural(units, 'день', 'дня', 'дней'),
      money(oneAsm), assemblyTotal, 'Доставка и сборка');

    if (o.steps) add('Ступеньки', '', '', o.stepsSum, 'Прочее');
    if (o.ventWallsSum) add('Вентзазор стен', m2(dims.liveArea), money(P.vent_walls), o.ventWallsSum, 'Прочее');
    if (o.ventRoofSum) add('Вентзазор крыши', m2(dims.totalArea), money(P.vent_roof), o.ventRoofSum, 'Прочее');
    if (o.portage) add('Пронос материалов, база ' + money(P.portage_base),
      o.portageM + ' м', money(P.portage_per_m), o.portageSum, 'Прочее');

    const note = (dims.liveArea ? 'Домик ' + dims.liveA + '×' + dims.liveB + ' м' : 'Только терраса') +
      (dims.terrArea ? (dims.liveArea ? ' + терраса ' : ' ') + dims.terrA + '×' + dims.terrB + ' м' : '') +
      ', всего ' + dims.totalArea.toFixed(1) + ' м²<br>' +
      'Каркас ' + FRAME_NAMES[frame] +
      (dims.liveArea ? ', отделка: ' + FINISH_NAMES[finish] : '') + '<br>' +
      'Кровля: ' + ROOF_MATERIALS[o.roofMat].label + ', ' + o.roofKey + '-скатная. ' +
      'Фундамент: ' + (o.isPiles ? 'сваи ' + PILE_SIZES[o.pileSize] : 'бетонные блоки') + '<br>' +
      units + '+' + units + ' — ' + units + ' ' + plural(units, 'доставка', 'доставки', 'доставок') +
      ' и ' + units + ' ' + plural(units, 'сборка', 'сборки', 'сборок') + ', дистанция ' + km + ' км';

    return { lines: lines, total: total, note: note, input: formState() };
  }

  // возврат формы к базовой комплектации
  function resetForm() {
    try { localStorage.removeItem(FORM_KEY); } catch (e) { /* не критично */ }
    foundManual = null;
    foundEditing = false;
    lastQuote = null;
    $('resultBox').innerHTML = '';

    ['liveA', 'liveB', 'terrA', 'terrB'].forEach(id => { $(id).value = ''; });
    $('hasTerrace').checked = false;
    $('frame').value = '50x50';
    $('distance').value = '';

    renderOptions();   // пересборка ставит базовую комплектацию заново
    refreshAll();
    toast('Расчёт сброшен к базовой комплектации');
  }

  // silent — расчёт идёт сам по ходу набора: пока данных мало, просто ничего не показываем.
  // по нажатию кнопки (silent = false) объясняем, чего не хватает
  const lineText = l => l.t + (l.q ? ': ' + l.q + (l.p ? ' × ' + l.p : '') : '');

  function calculate(silent) {
    const box = $('resultBox');
    const q = buildQuote();

    if (q.error) {
      lastQuote = null;
      box.innerHTML = silent ? '' : '<div class="result error">' + q.error + '</div>';
      return;
    }

    const lines = q.lines, total = q.total, note = q.note;
    lastQuote = { input: q.input, breakdown: { lines: lines, note: note }, total: total };

    box.innerHTML = '<div class="result"><div class="result-total">' + money(total) + '</div>' +
      lines.map(l => '<div class="result-row"><span>' + esc(lineText(l)) + '</span><span>' + money(l.v) + '</span></div>').join('') +
      '<div class="result-line">' + note + '</div></div>';
  }

  // короткое уведомление внизу экрана
  let toastTimer = null;
  function toast(text) {
    let el = $('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
  }

  // ============================================================
  //  СОБЫТИЯ
  // ============================================================

  document.addEventListener('DOMContentLoaded', () => {
    buildLists();
    renderOptions();
    const saved = savedForm();
    if (saved) applyForm(saved);
    else { $('liveA').value = 6; $('liveB').value = 9; }   // пример при первом открытии — размеры из подсказок полей
    refreshAll();

    $('options').addEventListener('click', e => {
      const st = e.target.closest('[data-step]');
      if (st) {
        const v = st.parentElement.querySelector('.val');
        v.textContent = Math.max(0, parseInt(v.textContent, 10) + parseInt(st.dataset.step, 10));
        return refreshAll();
      }
      const pill = e.target.closest('.pills button');
      if (pill) {
        pill.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on'));
        pill.classList.add('on');
        return refreshAll();
      }
      const head = e.target.closest('.ah');
      if (head) {
        const grp = head.parentElement;
        const willOpen = grp.querySelector('.acc-body').hidden;
        $('options').querySelectorAll('.acc-group').forEach(g => {
          g.classList.remove('open');
          g.querySelector('.acc-body').hidden = true;
          g.querySelector('.arrow').textContent = '⌄';
        });
        if (willOpen) {
          grp.classList.add('open');
          grp.querySelector('.acc-body').hidden = false;
          grp.querySelector('.arrow').textContent = '⌃';
        }
      }
    });

    $('options').addEventListener('change', refreshAll);

    $('options').addEventListener('input', e => {
      // вписали своё количество опор — расчёт от сторон больше не перебивает
      if (e.target.id === 'foundCount') {
        const v = e.target.value.trim();
        foundManual = v === '' ? null : Math.max(0, parseInt(v, 10) || 0);
      }
      refreshAll();
    });

    $('calcBtn').addEventListener('click', () => calculate(false));
    $('resetBtn').addEventListener('click', resetForm);

    ['frame', 'hasTerrace'].forEach(id =>
      $(id).addEventListener('change', refreshAll));
    ['liveA', 'liveB', 'terrA', 'terrB', 'distance'].forEach(id => {
      $(id).addEventListener('input', refreshAll);
      $(id).addEventListener('keydown', e => { if (e.key === 'Enter') calculate(false); });
    });

    document.addEventListener('click', e => {
      if (e.target.closest('#foundEdit')) {
        if (foundEditing) { foundEditing = false; foundManual = null; }
        else { foundEditing = true; }
        refreshAll();
        if (foundEditing) $('foundCount').focus();
      }
    });
  });
  </script>

</body>
</html>
