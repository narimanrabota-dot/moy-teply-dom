<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Покраска и «Как заказать» — варианты</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1E2A44;font-family:Onest,sans-serif}
.bar{position:fixed;inset:0 0 auto;z-index:2;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 12px;background:#1E2A44;color:#fff}
.g{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.g span{font-size:12px;color:#B9C1D0;margin-right:4px}
button{font:inherit;font-size:13px;font-weight:600;min-width:32px;height:30px;border:0;border-radius:8px;background:#2E3B58;color:#fff;cursor:pointer}
button.on{background:#C2461F} .nav button{background:#fff;color:#1E2A44;min-width:40px}
.t{font-size:14px;font-weight:600;margin-left:auto}
iframe{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;background:#fff}</style></head><body>
<div class="bar"><div class="g nav"><button id="pr">←</button><button id="nx">→</button></div><div class="g"><span>Покраска</span><button data-n="pokraska-01" title="Как у остальных">01</button><button data-n="pokraska-02" title="Два покрытия рядом">02</button><button data-n="pokraska-03" title="Процесс лентой">03</button><button data-n="pokraska-04" title="Белый каталог">04</button><button data-n="pokraska-05" title="Вкладки покрытий">05</button></div><div class="g"><span>Как заказать</span><button data-n="zakaz-01" title="Линия шагов">01</button><button data-n="zakaz-02" title="Четыре этапа">02</button><button data-n="zakaz-03" title="Шкала оплат">03</button><button data-n="zakaz-04" title="Белый минимум">04</button><button data-n="zakaz-05" title="Слайды этапов">05</button></div><span class="t" id="t"></span></div>
<iframe id="f"></iframe>
<script>
var T={"pokraska-01": "Покраска 01 — Как у остальных", "pokraska-02": "Покраска 02 — Два покрытия рядом", "pokraska-03": "Покраска 03 — Процесс лентой", "pokraska-04": "Покраска 04 — Белый каталог", "pokraska-05": "Покраска 05 — Вкладки покрытий", "zakaz-01": "Как заказать 01 — Линия шагов", "zakaz-02": "Как заказать 02 — Четыре этапа", "zakaz-03": "Как заказать 03 — Шкала оплат", "zakaz-04": "Как заказать 04 — Белый минимум", "zakaz-05": "Как заказать 05 — Слайды этапов"};var f=document.getElementById('f'),bar=document.querySelector('.bar'),order=[...document.querySelectorAll('button[data-n]')].map(b=>b.dataset.n),cur;
function fit(){f.style.top=bar.offsetHeight+'px';f.style.height=(innerHeight-bar.offsetHeight)+'px'}
function go(n){cur=n;f.src='eskiz-'+n+'.html';document.querySelectorAll('button[data-n]').forEach(b=>b.classList.toggle('on',b.dataset.n===n));document.getElementById('t').textContent=n+' — '+T[n];history.replaceState(null,'','#'+n)}
document.querySelectorAll('button[data-n]').forEach(b=>b.onclick=()=>go(b.dataset.n));
function step(d){var i=order.indexOf(cur);go(order[(i+d+order.length)%order.length])}
pr.onclick=()=>step(-1);nx.onclick=()=>step(1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
addEventListener('resize',fit);fit();go(location.hash.slice(1)||'pokraska-01');
</script></body></html>
