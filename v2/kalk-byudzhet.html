<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Бюджетный калькулятор — выбранные варианты · Мой тёплый дом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css?v=45">
<link rel="stylesheet" href="theme.css?v=41">
<style>
html,body{height:100%}
body.ks{margin:0;display:flex;flex-direction:column;background:var(--n-2);color:var(--ink)}
.ks-bar{position:relative;z-index:2;flex:none;display:grid;gap:var(--sp-8);padding:var(--sp-12) clamp(16px,3.4vw,44px);background:var(--card);box-shadow:var(--edge),var(--sh-1)}
.ks-top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8) var(--sp-16)}
.ks-h{margin:0 auto 0 0;font-size:var(--fs-md);font-weight:600;letter-spacing:-.01em}
.ks-dev{display:inline-grid;grid-auto-flow:column;gap:var(--sp-4);padding:var(--sp-4);border-radius:var(--r-inner);background:var(--n-2)}
.ks-dev button{min-height:36px;padding:0 var(--sp-12);border:0;border-radius:var(--r-tight);background:none;font:inherit;font-size:var(--fs-xs);font-weight:500;color:var(--dim);cursor:pointer}
.ks-dev button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--edge),var(--sh-1)}
.ks-open{font-size:var(--fs-xs);font-weight:500;color:var(--clay-txt)}
.ks-open:hover{color:var(--clay-btn-h)}
.ks-tabs{display:flex;gap:var(--sp-8);margin:0 calc(-1*clamp(16px,3.4vw,44px));padding:var(--sp-4) clamp(16px,3.4vw,44px);overflow-x:auto;scrollbar-width:none}
.ks-tabs::-webkit-scrollbar{display:none}
.ks-tab{flex:none;display:inline-flex;align-items:center;gap:var(--sp-8);min-height:var(--tap);padding:0 var(--sp-16) 0 var(--sp-8);border:0;border-radius:999px;background:var(--n-1);box-shadow:inset 0 0 0 1px var(--line);font:inherit;font-size:var(--fs-xs);font-weight:500;color:var(--ink);white-space:nowrap;cursor:pointer;transition:background-color .2s var(--e),color .2s var(--e)}
.ks-tab b{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--card);box-shadow:var(--edge);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.ks-tab:hover{background:var(--n-2)}
.ks-tab[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.ks-tab[aria-pressed="true"] b{background:var(--clay-btn);color:#fff;box-shadow:none}
.ks-tab:focus-visible,.ks-dev button:focus-visible,.ks-open:focus-visible{outline:2px solid var(--clay-btn);outline-offset:2px}
.ks-idea{margin:0;max-width:75ch;font-size:var(--fs-xs);line-height:1.4;color:var(--dim)}
.ks-stage{flex:1;min-height:0;display:flex;justify-content:center}
.ks-stage iframe{display:block;width:100%;border:0;background:var(--bg)}
.ks-stage.is-phone{padding:var(--sp-16)}
.ks-stage.is-phone iframe{width:390px;max-width:100%;border-radius:var(--r-shell);box-shadow:var(--edge),var(--sh-2)}
@media(max-width:560px){.ks-idea{display:none}}
@media(prefers-reduced-motion:reduce){.ks-tab{transition:none}}
</style>
</head>
<body class="ks">
<header class="ks-bar">
  <div class="ks-top">
    <h1 class="ks-h">Бюджетный калькулятор — выбранные варианты</h1>
    <div class="ks-dev" role="group" aria-label="Экран">
      <button type="button" data-dev="desk" aria-pressed="true">Компьютер</button>
      <button type="button" data-dev="phone" aria-pressed="false">Телефон</button>
    </div>
    <a class="ks-open" id="ks-open" href="kalk-byudzhet-01.html" target="_blank" rel="noopener">Открыть отдельно</a>
  </div>
  <nav class="ks-tabs" aria-label="Варианты">
    <button type="button" class="ks-tab" data-n="01" aria-pressed="false"><b>01</b>Как в бюджетном</button>
    <button type="button" class="ks-tab" data-n="05" aria-pressed="false"><b>05</b>Плитки с иконками</button>
    <button type="button" class="ks-tab" data-n="06" aria-pressed="false"><b>06</b>Цена сверху</button>
    <button type="button" class="ks-tab" data-n="07" aria-pressed="false"><b>07</b>Таблица-смета</button>
  </nav>
  <p class="ks-idea" id="ks-idea"></p>
</header>
<div class="ks-stage" id="ks-stage"><iframe id="ks-frame" title="Вариант калькулятора" src="kalk-byudzhet-01.html"></iframe></div>
<script>
(function () {
  var K = {"01": ["Как в бюджетном", "Одна карточка, как в бюджетном калькуляторе: площадь, терраса, группы опций раскрываются, у группы — число выбранного и сумма. Итог внизу."], "05": ["Плитки с иконками", "Опции — плитками с иконкой и ценой: нажал — отметилась. Итог — в шапке калькулятора."], "06": ["Цена сверху", "Крупная цена и площадь вверху, прилипают при прокрутке. Ниже группы опций, у каждой своя сумма."], "07": ["Таблица-смета", "Плотная таблица, как смета: галочка, опция, ставка, сумма для этого дома, итоги групп и общий итог."]};
  var tabs = [].slice.call(document.querySelectorAll('.ks-tab')), frame = document.getElementById('ks-frame'),
      idea = document.getElementById('ks-idea'), open = document.getElementById('ks-open'), stage = document.getElementById('ks-stage');
  function go(n, keep) {
    if (!K[n]) n = '01';
    tabs.forEach(function (t) {
      var on = t.getAttribute('data-n') === n;
      t.setAttribute('aria-pressed', String(on));
      if (on) t.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    var url = 'kalk-byudzhet-' + n + '.html';
    if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
    open.href = url;
    idea.textContent = K[n][1];
    document.title = n + ' · ' + K[n][0] + ' — бюджетный калькулятор, выбранные варианты';
    if (keep) history.replaceState(null, '', '#' + n);
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { go(t.getAttribute('data-n'), true); }); });
  document.addEventListener('keydown', function (e) {
    var i = tabs.findIndex(function (t) { return t.getAttribute('aria-pressed') === 'true'; });
    if (e.key === 'ArrowRight' && i < tabs.length - 1) go(tabs[i + 1].getAttribute('data-n'), true);
    if (e.key === 'ArrowLeft' && i > 0) go(tabs[i - 1].getAttribute('data-n'), true);
  });
  [].forEach.call(document.querySelectorAll('[data-dev]'), function (b) {
    b.addEventListener('click', function () {
      [].forEach.call(document.querySelectorAll('[data-dev]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      stage.classList.toggle('is-phone', b.getAttribute('data-dev') === 'phone');
    });
  });
  window.addEventListener('hashchange', function () { go(location.hash.slice(1), false); });
  go(location.hash.slice(1), false);
})();
</script>
</body>
</html>
