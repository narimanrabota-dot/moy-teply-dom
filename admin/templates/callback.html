<div class="ov" id="callback" hidden>
  <div class="mdl" role="dialog" aria-modal="true" aria-labelledby="cb-title">
    <button class="x" type="button" aria-label="Закрыть" data-cb-close>×</button>
    <form class="cb" novalidate>
      <div class="cb__h">
        <b class="cb__t" id="cb-title">Заказать звонок</b>
        <p class="cb__p">Оставьте номер — перезвоним и ответим на вопросы.</p>
      </div>
      <label class="fld">
        <span class="fld__l">Телефон</span>
        <input class="fld__i" id="cb-tel" type="tel" inputmode="tel"
               placeholder="+7 (___) ___-__-__" autocomplete="tel"
               aria-describedby="cb-err" required>
        <span class="fld__e" id="cb-err" hidden>Введите номер полностью</span>
      </label>
      <label class="chk">
        <input type="checkbox" id="cb-ok" checked required>
        <span>Согласен на <a href="politika.html" target="_blank">обработку персональных данных</a> и принимаю <a href="soglashenie.html" target="_blank">условия сайта</a></span>
      </label>
      <button type="submit" class="btn btn--c cb__go">Жду звонка</button>
    </form>
  </div>
</div>
