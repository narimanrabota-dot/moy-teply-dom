server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # старые адреса удалённых карточек
    location = /v2/proekt-6h9.html  { return 301 /v2/index.html; }
    location = /v2/proekt-6h75.html { return 301 /v2/index.html; }

    # служебные файлы не отдаём
    location ~ /\.            { deny all; }
    location ~* \.(md|py|yml|yaml)$ { deny all; }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
