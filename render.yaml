    name: moy-teply-dom
    runtime: static
    staticPublishPath: .
    # Служебное в выкладку не идёт: файлы остаются в git, а из опубликованной
    # копии их убирает сборка. Правилом routes этого не сделать — Render не
    # применяет правила к адресу, по которому лежит файл
    # (docs/redirects-rewrites, «Rule matching and ordering»).
    buildCommand: rm -rf tools docs znanie CLAUDE.md SPRAVKA.md README.md
